[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nguyen Nam Duong", email = "nguyennamduong205@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=50.0.1",
    "deep-translator>=1.11.4",
    "edge-tts==7.3.1",
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
